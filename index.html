<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Video</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #ff5722;
        }
        /* Video Wrapper untuk Videy.co */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Rasio 16:9 */
            height: 0;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        /* Preview Gambar */
        .image-preview {
            margin: 15px 0;
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 6px;
        }
        /* Tombol Smartlink */
        .cta-button {
            display: inline-block;
            background: #ff5722;
            color: white;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            margin: 15px 0;
            transition: background 0.3s;
        }
        .cta-button:hover {
            background: #e64a19;
        }
        /* Area Iklan Banner 300x250 */
        .ad-banner-300 {
            margin: 20px auto;
            width: 300px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Area Native Banner */
        .ad-native {
            margin: 20px 0;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 5px;
        }
    </style>

    <!-- 1. KODE POPUNDER ADSTERRA -->
    <script src="https://thewilddetail.com/58/5d/14/585d14a1088579ccf27a4840dfa44967.js"></script>
</head>
<body>

    <div class="container">
        <h1>Nonton Video Eksklusif</h1>

        <!-- PREVIEW GAMBAR -->

        <!-- PEMUTAR VIDEO VIDEY.CO -->
        <div class="video-container">
            <iframe src="https://videy.co/embed?id=T2hKO9ts1" allowfullscreen></iframe>
        </div>

        <!-- TOMBOL SMARTLINK ADSTERRA -->
        <div>
            <a href="https://thewilddetail.com/jcmqzgpi?key=24b55e3636d607271fdc76c2cd116ebe" target="_blank" class="cta-button">👉 Klik Disini untuk Download / Streaming HD 👈</a>
        </div>

        <!-- 2. KODE BANNER 300x250 ADSTERRA -->
        <div class="ad-banner-300">
            <script>
              atOptions = {
                'key' : '00a1893d1605de9376529219e8c0dca3',
                'format' : 'iframe',
                'height' : 250,
                'width' : 300,
                'params' : {}
              };
            </script>
            <script src="https://thewilddetail.com/00a1893d1605de9376529219e8c0dca3/invoke.js"></script>
        </div>

        <!-- 3. KODE NATIVE BANNER ADSTERRA -->
        <div class="ad-native">
            <script async="async" data-cfasync="false" src="https://thewilddetail.com/4ac27ece24247e6abb30fb78ea2f725e/invoke.js"></script>
            <div id="container-4ac27ece24247e6abb30fb78ea2f725e"></div>
        </div>
    </div>

    <!-- 4. KODE SOCIAL BAR ADSTERRA -->

</html>
