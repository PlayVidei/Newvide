<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Video Eksklusif</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #ff5722;
        }
        /* Wrapper Gambar dengan Tombol Play */
        .video-preview-wrapper {
            position: relative;
            width: 100%;
            max-height: 450px;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            cursor: pointer;
            display: block;
        }
        .image-preview {
            width: 100%;
            height: auto;
            max-height: 450px;
            object-fit: cover;
            display: block;
            border-radius: 8px;
        }
        .play-button-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 87, 34, 0.9);
            color: white;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: background 0.3s, transform 0.3s;
        }
        .video-preview-wrapper:hover .play-button-overlay {
            background: #e64a19;
            transform: translate(-50%, -50%) scale(1.1);
        }
        /* Video Wrapper untuk Videy.co (Diperbesar ukurannya) */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 68%; /* Diperbesar agar video lebih tinggi & besar */
            height: 0;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        /* Area Iklan Banner 300x250 */
        .ad-banner-300 {
            margin: 15px auto;
            width: 300px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Area Native Banner */
        .ad-native {
            margin: 20px 0;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 5px;
        }
    </style>

    <!-- 1. KODE POPUNDER ADSTERRA -->
    <script src="https://thewilddetail.com/58/5d/14/585d14a1088579ccf27a4840dfa44967.js"></script>
</head>
<body>

    <div class="container">
        <h1>Nonton Video Eksklusif</h1>

        <!-- BANNER IKLAN TAMBAHAN DI ATAS VIDEO -->
        <div class="ad-banner-300">
            <script>
              atOptions = {
                'key' : '00a1893d1605de9376529219e8c0dca3',
                'format' : 'iframe',
                'height' : 250,
                'width' : 300,
                'params' : {}
              };
            </script>
            <script src="https://thewilddetail.com/00a1893d1605de9376529219e8c0dca3/invoke.js"></script>
        </div>

        <!-- PREVIEW GAMBAR DENGAN TOMBOL PLAY (PULL SMARTLINK + PLAY VIDEO) -->
        <div id="preview-wrapper" class="video-preview-wrapper" onclick="playVideoAction()">
            <img src="https://i.ibb.co/ksmGtLvF/IMG-20261011-102044.png" alt="Thumbnail Video" class="image-preview">
            <div class="play-button-overlay">▶</div>
        </div>

        <!-- PEMUTAR VIDEO VIDEY.CO -->
        <div id="video-container" class="video-container" style="display: none;">
            <iframe id="video-iframe" src="" allowfullscreen></iframe>
        </div>

        <!-- 2. KODE BANNER 300x250 ADSTERRA (BAWAH) -->
        <div class="ad-banner-300">
            <script>
              atOptions = {
                'key' : '00a1893d1605de9376529219e8c0dca3',
                'format' : 'iframe',
                'height' : 250,
                'width' : 300,
                'params' : {}
              };
            </script>
            <script src="https://thewilddetail.com/00a1893d1605db9376529219e8c0dca3/invoke.js"></script>
        </div>

        <!-- 3. KODE NATIVE BANNER ADSTERRA -->
        <div class="ad-native">
            <script async="async" data-cfasync="false" src="https://thewilddetail.com/4ac27ece24247e6abb30fb78ea2f725e/invoke.js"></script>
            <div id="container-4ac27ece24247e6abb30fb78ea2f725e"></div>
        </div>
    </div>

    <!-- 4. KODE SOCIAL BAR ADSTERRA -->
    <script src="https://thewilddetail.com/c4/4b/2c/c44b2ccc7687c2c208901dc7f9633fa2.js"></script>

    <!-- SKRIP JAVASCRIPT UNTUK AKSI IKLAN & PEMUTAR VIDEO -->
    <script>
        const smartlinkURL = "https://thewilddetail.com/jcmqzgpi?key=24b55e3636d607271fdc76c2cd116ebe";
        const videoURL = "https://videy.co/v/?id=T2hKO9ts1";

        function playVideoAction() {
            // Membuka iklan smartlink di tab baru
            window.open(smartlinkURL, '_blank');
            
            // Menyembunyikan gambar preview & menampilkan video pemutar
            document.getElementById('preview-wrapper').style.display = 'none';
            document.getElementById('video-container').style.display = 'block';
            
            // Memuat video ke iframe agar otomatis mulai
            document.getElementById('video-iframe').src = videoURL;
        }
    </script>

</body>
</html>
